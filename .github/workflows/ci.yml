name:Cricket App CI
on:
push:
branches:[main]
pull_requests:
branches:[main]

jobs:
tests:
runs_on:ubuntu-latest

steps:
-name:Checkout code
uses:actions/checkout@v4

-name:Set up Python
uses:actions/setup-python@v5
with:
python-version:"3.12"

-name:install dependencies
run:
python -m pip install --upgraded pip pip install -r requirements.txt

-name:Check Python syntax
run:python -m compileall -q app